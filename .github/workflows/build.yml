name: Build Appearance Viewer
on:
  pull_request:
    branches: [main]
  push:
    branches: ["upstream-sync/**", "main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --check main.js
      - name: Package installable plugin
        run: |
          mkdir -p dist/xnotes-appearance-viewer
          cp main.js manifest.json styles.css dist/xnotes-appearance-viewer/
          cd dist
          zip -r xnotes-appearance-viewer.zip xnotes-appearance-viewer
      - uses: actions/upload-artifact@v4
        with:
          name: xnotes-appearance-viewer
          path: dist/xnotes-appearance-viewer.zip
          if-no-files-found: error
